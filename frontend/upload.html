<!DOCTYPE html>
<html>
<head>
  <title>SkillBridge | Upload Resume</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen">

  <!-- NAVBAR -->
  <nav class="bg-slate-800 px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">SkillBridge</h1>

    <div class="space-x-6">
      <a href="dashboard.html" class="hover:text-blue-400">Dashboard</a>
      <a href="upload.html" class="hover:text-blue-400">Resume</a>
      <a href="analysis.html" class="hover:text-blue-400">Analysis</a>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="p-6 max-w-6xl mx-auto">

    <h1 class="text-3xl font-bold mb-2">Upload Resume</h1>
    <p class="text-slate-400 mb-6">
      Upload your resume and optionally edit extracted text for better accuracy
    </p>

    <!-- Upload Card -->
    <div class="bg-slate-800 p-6 rounded-lg mb-8">
      <label class="block mb-2 font-semibold">
        Select Resume (PDF only)
      </label>

      <input
        type="file"
        id="resume"
        accept=".pdf"
        class="mb-4 text-slate-300"
      />

      <button
        onclick="uploadResume()"
        class="bg-blue-500 hover:bg-blue-600 px-6 py-2 rounded font-semibold"
      >
        Upload Resume
      </button>

      <p id="status" class="mt-4 text-slate-300"></p>
    </div>

    <!-- Resume Preview / Edit -->
    <div class="bg-slate-800 p-6 rounded-lg">
      <h2 class="text-xl font-bold mb-2">
        Resume Text Preview / Edit
      </h2>

      <p class="text-slate-400 mb-4">
        You can edit the extracted text to fix formatting or skill naming issues
      </p>

      <textarea
        id="resumeText"
        rows="10"
        class="w-full bg-slate-900 p-4 rounded text-slate-200"
        placeholder="Extracted resume text will appear here after upload..."
      ></textarea>

      <button
        onclick="saveResumeText()"
        class="mt-4 bg-green-500 hover:bg-green-600 px-6 py-2 rounded font-semibold"
      >
        Save & Re-Analyze
      </button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
