<!DOCTYPE html>
<html>
<head>
  <title>SkillBridge | Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen">

  <!-- NAVBAR -->
  <nav class="bg-slate-800 px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">SkillBridge</h1>

    <div class="space-x-6">
      <a href="dashboard.html" class="hover:text-blue-400">Dashboard</a>
      <a href="upload.html" class="hover:text-blue-400">Resume</a>
      <a href="analysis.html" class="hover:text-blue-400">Analysis</a>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="p-6 max-w-6xl mx-auto">

    <!-- Header -->
    <h1 class="text-3xl font-bold mb-2">Dashboard</h1>
    <p class="text-slate-400 mb-8">
      Welcome to SkillBridge
    </p>

    <!-- Resume usage card -->
    <div class="bg-slate-800 p-6 rounded-lg mb-8 w-full md:w-96">
      <p class="text-lg font-semibold">Resume Usage</p>
      <p class="text-slate-300 mt-2">
        Resumes used: <span id="resumeCount">0</span> / 3
      </p>
    </div>

    <!-- Action buttons -->
    <div class="flex flex-wrap gap-4">
      <a href="upload.html"
         class="bg-green-500 hover:bg-green-600 px-6 py-3 rounded font-semibold">
        Upload / Edit Resume
      </a>

      <a href="analysis.html"
         class="bg-blue-500 hover:bg-blue-600 px-6 py-3 rounded font-semibold">
        Analyze Skills
      </a>
    </div>

  </div>

</body>
</html>
