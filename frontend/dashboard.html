<!DOCTYPE html>
<html>
<head>
  <title>SkillBridge | Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen">

  <div class="p-6">
    <h1 class="text-3xl font-bold mb-2">Dashboard</h1>
    <p class="text-slate-400 mb-6">
      Welcome to SkillBridge
    </p>

    <!-- Resume usage card -->
    <div class="bg-slate-800 p-4 rounded-lg mb-6 w-80">
      <p class="text-lg font-semibold">Resume Usage</p>
      <p class="text-slate-300 mt-2">
        Resumes used: <span id="resumeCount">0</span> / 3
      </p>
    </div>

    <!-- Actions -->
    <div class="space-x-4">
      <a href="upload.html"
         class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded font-semibold">
        Upload / Edit Resume
      </a>

      <a href="analysis.html"
         class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded font-semibold">
        Analyze Skills
      </a>
    </div>
  </div>

</body>
</html>
